<!-- ============================================================
     PRODUCTS PAGE  –  products come from the InventaAPI key
     ============================================================ -->

<div class="sync-banner" id="sync-banner"></div>

<!-- Toolbar -->
<div class="page-toolbar">
  <div class="toolbar-left">
    <input type="text" class="search-input" id="product-search" placeholder="Search name, SKU, category..." oninput="filterProducts()" />
    <select class="form-control" id="product-category-filter" onchange="filterProducts()" style="width:180px; padding:9px 12px;">
      <option value="">All Categories</option>
    </select>
  </div>
  <div class="toolbar-right">
    <button class="btn btn-primary" id="sync-btn" onclick="syncProducts()">⟳ Sync from API</button>
  </div>
</div>

<!-- Table -->
<div class="card">
  <div class="card-header">
    <h2>Products on your API key</h2>
    <span id="product-count" style="font-size:12px; color:var(--text-xs);"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Product</th>
        <th>SKU</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="product-table-body">
      <tr class="empty-row"><td colspan="8">Loading...</td></tr>
    </tbody>
  </table>
</div>

<!-- ── Price & Stock Modal ── -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Set price &amp; stock</h3>
      <button class="modal-close" onclick="closeProductModal()">✕</button>
    </div>

    <p style="font-size:14px; font-weight:700; margin-bottom:2px;" id="p-name"></p>
    <p style="font-size:12px; color:var(--text-xs); margin-bottom:16px;" id="p-meta"></p>

    <div class="form-row">
      <div class="form-group">
        <label for="p-price">Selling Price (₱) *</label>
        <input type="number" class="form-control" id="p-price" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label for="p-stock">Stock Quantity *</label>
        <input type="number" class="form-control" id="p-stock" placeholder="0" min="0" step="1" />
      </div>
    </div>

    <div class="form-group">
      <label for="p-threshold">Low Stock Threshold</label>
      <input type="number" class="form-control" id="p-threshold" placeholder="5" min="0" step="1" />
    </div>

    <p style="font-size:11px; color:var(--text-xs);">Name, SKU and category come from InventaAPI. Price and stock are kept by this POS.</p>

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
      <button class="btn btn-primary" id="p-save" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>
