<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickPOS · InventaAPI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon" id="store-icon">🛒</div>
      <div class="sidebar-logo-text">
        <span class="logo-name">QuickPOS</span>
        <span class="logo-sub" id="store-name">InventaAPI Test POS</span>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar">&#8249;</button>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">
      <p class="nav-section-label">MAIN MENU</p>

      <a class="nav-item active" data-page="dashboard" href="#dashboard">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
        </span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a class="nav-item" data-page="cashier" href="#cashier">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
        </span>
        <span class="nav-label">Cashier</span>
      </a>

      <a class="nav-item" data-page="products" href="#products">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </span>
        <span class="nav-label">Products</span>
      </a>

      <a class="nav-item" data-page="transactions" href="#transactions">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </span>
        <span class="nav-label">Transactions</span>
      </a>

      <p class="nav-section-label">INVENTA API</p>

      <a class="nav-item" data-page="apikey" href="#apikey">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="15.5" r="4.5"/>
            <path d="M10.7 12.3L21 2"/>
            <path d="M16 7l3 3"/>
            <path d="M18 5l2 2"/>
          </svg>
        </span>
        <span class="nav-label">API Key</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <span class="user-name">Cashier</span>
          <span class="user-role">QuickPOS</span>
        </div>
      </div>
    </div>

  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main-wrapper" id="main-wrapper">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="page-title">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <select class="form-control store-select" id="store-select" aria-label="Store" onchange="onStoreChange(this.value)"></select>
        <div class="store-status" id="conn-status">
          <span class="status-dot"></span>
          <span>Connecting…</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content" id="page-content">
      <!-- Pages injected here by router -->
    </main>

  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/dashboard.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cashier.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/apikey.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
